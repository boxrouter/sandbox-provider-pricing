[extend]
useDefault = true

[[allowlists]]
description = "The scraped page embeds a public analytics project key intended for browser ingestion, not a private API key."
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)tests/fixtures/pages/blaxel-pricing\.html$''']
regexTarget = "match"
regexes = ['''data-key="phc_[A-Za-z0-9]{43}"''']

[[allowlists]]
description = "Modal's scraped page embeds PostHog's public browser project key, not a private API key."
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)tests/fixtures/pages/modal-pricing\.html$''']
regexTarget = "match"
regexes = ['''phc_[A-Za-z0-9]{43}''']

[[allowlists]]
description = "Public image signing-key fingerprints in the pinned benchmark verifier wheel identify verification keys, not private keys."
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)parameters/(deepswe|terminal-bench-4-0)/[^/]+/protocol\.json$''']
regexTarget = "line"
regexes = ['''^\s*"GPG_KEY": "[0-9A-Fa-f]{40}",?\s*$''']

[[allowlists]]
description = "The source commit in the pinned benchmark verifier wheel pins a public repository revision, not an authentication credential."
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)reference-tests/network/run\.py$''']
regexTarget = "match"
regexes = ['''FASTAPI_COMMIT = "[0-9a-f]{40}"''']
