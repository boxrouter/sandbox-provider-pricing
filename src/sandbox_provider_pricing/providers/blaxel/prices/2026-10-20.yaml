exclusions:
- Snapshot storage $0.20 / GB-month (the state kept for a sandbox in standby)
- Images $0.045 / GB-month (templated deployment images; unknown whether Blaxel's own blaxel/base-image
  is charged)
- Volumes $0.12 / GB-month provisioned, only when attached
- Docs say storage is charged while a sandbox is active; no rate for the sandbox's own filesystem is published
  (it is a tmpfs in RAM, about 50% of memory)
- 'Internet egress and internal traffic: Included. No per-creation fee published'
- 'Plan: Pay-as-you-go $0.00 / month, the same rate at every tier. Which sizes it needs: Blaxel publishes
  no per-sandbox size cap by tier (the quotas page says higher tiers unlock ''higher sandbox and volume
  sizes''). In a test account, creating a 4/8 sandbox returned 429. A third-party card (battleships.dev)
  lists a 4 GB cap for Tier 0 that it marks ''not re-verified''; this is an unverified third-party figure.
  Higher sizes presumably need a higher tier by top-up ($20 / month Tier 1, $50 / month Tier 2, the rest
  unpublished) or a quota request. Optional add-ons: email support $800 / month + 3% of usage, dedicated
  support $1,600 / month + 10%, HIPAA $250 / month; wildcard custom domains $20 / domain-month; dedicated
  IPs, egress proxy free during beta'
- 'Plan allowance: Up to $200 in free credits (promotional credit does not count toward tier top-ups);
  Tier 0 is free with 10 sandboxes, Tier 1 needs a $20 / month top-up (50), Tier 2 $50 / month (200)'
- 'CPU: bundled with allocated memory; no separate CPU rate is published.'
open_questions:
- 'Which size a given plan can create: in a test account, 4/8 returned 429; whether 8/16 needs more than
  a tier top-up is not stated.'
- 'GB vs GiB: the rate says GB and the API memory is in MB, so 4096 MB may bill as 4 GB ($0.1656 / h)
  or 4.096 GB ($0.1696 / h); Blaxel does not define it'
- 'CPU at each memory size: the web docs give only 8 GB -> 4 and 16 GB -> 6 cores; the 2 GB and 4 GB rows
  rest on the SDK docstring (MB / 2048) and a live nproc check in a test sandbox, and cores may be a share
  rather than a reservation'
- 'Billing granularity and minimum charge per sandbox: not published'
- 'Whether the sandbox''s root filesystem storage is billed while active, and at what rate: not published'
- Whether the free-credit balance is drawn down at these list rates (assumed)
- No page shows an update date; the pricing page was read once on the retrieval date above
- 'Range: lower bound $0 of compute, because with no active connection a sandbox drops to standby in about
  15 seconds and memory is not billed, leaving only snapshot storage ($0.000274 per snapshot GB-hour).
  Upper bound: every figure above, with the sandbox active (a connection is open, or keep-alive holds
  it) for the whole hour. Blaxel bills allocated memory only while the sandbox is active, not CPU use,
  so one hour of one sandbox costs anywhere from the snapshot storage to the full figure depending on
  how much of the hour it has a connection. An hour is priced here at the upper end; an idle WebSocket/TCP
  connection keeps billing for up to 15 minutes (docs: 15-minute idle timeout).'
- The public pricing and sandbox pages say memory is billed by the allocated amount and the SDK takes
  MB, but do not publish discrete memory tier boundaries. The 2048, 4096, 8192, 16384 and 32768 MiB steps
  are an unverified assumption carried over from earlier price data; confirm with Blaxel before using
  them for bill reconciliation.
snapshot_storage:
  usd: '0.20'
  per: gib-month
  rate_source: published_snapshot_rate
  source_url: https://blaxel.ai/pricing
  checked_at: '2026-10-20T05:47:33Z'
  note: Published as GB-month; Blaxel defines all storage sizes as binary GiB (1 GB = 2^30 bytes), so the
    rate is recorded per GiB-month. This corrects an earlier version that treated the figure as decimal
    GB.
