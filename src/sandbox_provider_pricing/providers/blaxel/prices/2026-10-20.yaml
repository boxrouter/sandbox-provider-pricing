    CPU. | $0.0000115 / GB RAM · second'
- url: https://blaxel.ai/pricing
  quote: Snapshots storage | Memory and filesystem snapshots that keep suspended sandboxes ready to resume.
    | $0.20 / GB · month
- url: https://blaxel.ai/pricing
  quote: Images | Templated deployment images stored for fast and repeatable creation. | $0.045 / GB ·
