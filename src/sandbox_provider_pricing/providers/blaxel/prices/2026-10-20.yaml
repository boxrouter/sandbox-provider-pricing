- url: https://blaxel.ai/pricing
  quote: Tier | Minimum top-up required | Sandbox limit | Tier 0 | Free | 10 | Tier 1 | $20 / month |
    50 | Tier 2 | $50 / month | 200 | … 7 more tiers … | Tier 9 | Contact us | 100,000+
- url: https://blaxel.ai/pricing
  quote: Email support [ADD-ON] $800/ MONTH + 3% OF USAGE | Dedicated support [ADD-ON] $1,600/ MONTH +
    10% OF USAGE | HIPAA [ADD-ON] $250/ MONTH
- url: https://docs.blaxel.ai/Sandboxes/Overview
  quote: You are charged for memory (based on how much you allocated at sandbox creation) and storage
    while a sandbox is in active mode. CPU resources are allocated accordingly by Blaxel based on your
    selected memory allocation and are not charged separately. For example, a sandbox with 8 GB memory
    is allocated 4 CPU cores, while one with 16 GB memory is allocated 6 CPU cores.
- url: https://docs.blaxel.ai/Sandboxes/Overview
  quote: If a sandbox does not have an active connection, it automatically transitions to a warm standby
    mode (also called scale-to-zero ). This transition happens in approximately 15 seconds.
- url: https://docs.blaxel.ai/Sandboxes/Overview
  quote: You are not charged for memory while a sandbox is in standby mode. However, you are charged for
    the storage of the snapshot and/or the volumes.
- url: https://docs.blaxel.ai/Sandboxes/Overview
  quote: Due to this, Blaxel sandboxes reserve, when possible, approximately 50% of the available memory
    for the tmpfs filesystem.
- url: https://docs.blaxel.ai/Sandboxes/Templates.md
  quote: 'memory: 8192, // Memory in MB (default: 4096)'
- url: https://docs.blaxel.ai/Security/Quotas
  quote: Higher tiers have access to higher limits such as more standby/concurrent sandboxes, more concurrent
    jobs, higher sandbox and volume sizes, longer sandbox TTLs.
- url: https://docs.blaxel.ai/Security/Quotas
  quote: Promotional credits (such as startup program grants) and previously accumulated balances automatically
    apply toward your active infrastructure costs. However, they do not count toward the 30-day top-up
    volume required to unlock or maintain a quota tier.
- url: https://docs.blaxel.ai/api-reference/compute/create-sandbox.md
  quote: Memory allocation in megabytes. Also determines CPU allocation (CPU cores = memory in MB / 2048,
    e.g., 4096MB = 2 CPUs).
- url: https://docs.blaxel.ai/Sandboxes/Overview
  quote: 'memory: 4096, // in MB'
- url: https://blaxel.ai/platform/storage
  quote: All sizes are binary gigabytes (GiB), where 1 GB = 2^30 bytes.
classes:
