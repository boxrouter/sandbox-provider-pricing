- url: https://blaxel.ai/pricing
  quote: Provisioned capacity | Billed on the volume size you provision, for as long as the volume exists,
    regardless of how much data you actually write in it. | $0.12 / GB · month
- url: https://blaxel.ai/pricing
  quote: Internet egress traffic | Outbound traffic from your workloads to the internet. | Included
