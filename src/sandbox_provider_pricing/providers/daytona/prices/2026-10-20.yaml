exclusions:
- no per-sandbox creation fee, egress charge or plan fee is listed on the pricing page (absence of a listing,
  not a statement that none exist); network limits are applied by billing tier
- snapshots made from a sandbox remain billed for storage; the snapshot storage rate is not published
- 'which plan the rates need: none. Rates are the same for every tier; Tier 1 (email verified) is enough
  for the sizes up to 4/8 per sandbox, but its organization pool is 10 vCPU and 10 GiB of RAM in one table
  (20 GiB in another), so one 4/8 sandbox fits, and a second only if the 20 GiB figure is the right one.'
- 'not applicable to these sizes: Windows +$0.0858 per vCPU-hour, GPU sandboxes (separate hourly prices)'
- 'Plan allowance: $200 in free compute, no credit card for the trial (free credits do not cover GPU sandboxes);
  Tier 1 (email verified) limits the whole organization to 10 vCPU and 30 GiB storage (RAM 10 or 20 GiB,
  see open_questions); Tier 2 (card + $25 top-up) 100 vCPU; Tier 3 ($500) 250 vCPU; Tier 4 ($2,000 every
  30 days) 500 vCPU; startups: up to $50k credits'
open_questions:
- is the 'first 5 GiB free' per sandbox or per organization? The pricing page footnote and the billing,
  limits, sandboxes and snapshots docs do not say; it moves the hour by at most $0.00054 at 2/4 (0.000864
  vs 0.000324) and $0.00108 at 4/8
- '8/16: Daytona documents a 4 vCPU / 8 GiB per-sandbox maximum and a Custom tier through support, but
  publishes no larger size or price'
- whether a smaller disk can be requested at the preset sizes was not tested
- no regional multiplier is published; not verified for regions other than us
- snapshot storage rate is unpublished
- Daytona's limits page gives Tier 1 RAM as 10 GiB in one table and 20 GiB in another; irrelevant to price
- the exact wording of any per-second rounding is not documented (the pricing page says only that billing
  is calculated per second)
- 'GPU: as checked on 2026-10-03, the on-demand Nvidia B300 is $6.25 per GPU-hour (source quote: $6.25/h),
  corrected from $7.10. The schema has no GPU-model field, so this value is not represented as an unqualified
  gpu rate.'
- 'GPU class: the pricing page publishes both preemptible and on-demand rates; usage must record which
  schedule applied. When no class is recorded, the default is preemptible, matching the existing Daytona
  GPU price.'
