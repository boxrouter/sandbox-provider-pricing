- url: https://www.daytona.io/docs/en/billing/
  quote: Creating Starting Stopping Pausing | ✓ | ✓ | ✓ | Billed the same as started. Resources remain
    reserved during these transitions, so reduced billing applies once the sandbox reaches the stopped
