exclusions:
- no per-sandbox creation fee, egress charge or plan fee is listed on the pricing page (absence of a listing,
  not a statement that none exist); network limits are applied by billing tier
- snapshots made from a sandbox remain billed for storage; the snapshot storage rate is not published
- 'which plan the rates need: none. The pricing page lists one set of rates and no tier-specific rates;
  Tier 1 (email verified) allows sandboxes up to the 4 vCPU / 8 GiB per-sandbox maximum, but its
  organization pool is 10 vCPU and 10 GiB of RAM in one table (20 GiB in another), so one such sandbox
  fits, and a second only if the 20 GiB figure is the right one.'
- 'not priced here: Windows (the pricing page lists "OS Windows $0.0858/vCPU/h"). GPU sandboxes are priced
  per GPU model in each class.'
- 'Plan allowance: $200 in free compute, no credit card for the trial (free credits do not cover GPU sandboxes);
  Tier 1 (email verified) limits the whole organization to 10 vCPU and 30 GiB storage (RAM 10 or 20 GiB,
  see open_questions); Tier 2 (card + $25 top-up) 100 vCPU; Tier 3 ($500) 250 vCPU; Tier 4 ($2,000 every
  30 days) 500 vCPU; startups: up to $50k credits'
open_questions:
- 'Is the pricing page''s "Price per GiB after first 5 free" per sandbox or per organization? The billing,
  limits, sandboxes and snapshots docs do not say. At most it moves an hour''s price by $0.00054 (5 GiB at
  $0.000108 per GiB-hour).'
- 'Larger sizes: Daytona documents a 4 vCPU / 8 GiB per-sandbox maximum and a Custom tier through support, but
  publishes no larger size or price'
- whether a smaller disk can be requested at the preset sizes was not tested
- no regional multiplier is published; not verified for regions other than us
- snapshot storage rate is unpublished
- Daytona's limits page gives Tier 1 RAM as 10 GiB in one table and 20 GiB in another; irrelevant to price
- the exact wording of any per-second rounding is not documented (the pricing page says only that billing
  is calculated per second)
- 'GPU: as checked on 2026-10-03, the on-demand Nvidia B300 is $6.25 per GPU-hour (source quote: $6.25/h),
  corrected from $7.10.'
- 'GPU class: the two classes differ only in their GPU rates; their CPU, memory and disk rates and meters
  are the same. The pricing page lists GPU rates under "Preemptible ($/hour)" and "On-demand ($/hour)".
  The sandboxes page says "GPU sandboxes are on-demand. See spot GPU sandboxes for preemptible GPU capacity."
  and "Spot GPU sandboxes are preemptible and run on GPU capacity that is not being used by reserved (on-demand)
  sandboxes." Usage must record which schedule applied.'
- 'Default class: on-demand, because the sandboxes page says "GPU sandboxes are on-demand" and preemptible
  GPU capacity is a separate spot sandbox. No Daytona page assigns either class to a sandbox without a GPU;
  both classes have the same CPU, memory and disk rates, so the default does not change the figure for such
  a sandbox.'
- 'Correction: this version supersedes daytona@2026-10-20 from its effective date and changes no listed rate.
  It quotes Daytona''s pages on the GPU classes instead of saying that preemptible is the default when no
  class is recorded, and makes on-demand the default class, so a GPU usage record that names no class is
  priced at the on-demand rates the docs describe as the default; says that the snapshot storage
  figure is an assumed, unpublished rate that per-sandbox figures do not use; says that the pricing page
  lists one set of rates and no tier-specific rates, instead of that rates are the same for every tier;
  and quotes the Windows rate as the page lists it, instead of as an addition to the vCPU rate.'
- 'Spec classes: this version adds `covers` to the on-demand class, so a usage record whose class is the spec
  class `container` or `vm` is priced at the one rate table. Read 2026-10-24: daytona.io/pricing lists one
  set of CPU, memory and disk rates and no VM-specific rate, and daytona.io/docs/en/billing says Paused is
  "Billed for reserved disk only ... Supported for VM sandboxes only" and Archived is "Not billed. Supported
  for container sandboxes only". The class''s meter bills disk while paused and stopped; only a VM reaches
  paused, and an archived container is not billed in any state this version meters. The preemptible class
  covers only its own name, a GPU schedule that is not a spec class. No rate changed.'

snapshot_storage:
  usd: '0.000108'
  per: gib-hour
  rate_source: published_disk_rate_proxy
  source_url: https://www.daytona.io/pricing
  checked_at: '2026-10-20T06:19:42Z'
  note: Daytona's published disk rate. Daytona does not publish a snapshot rate, so this is an assumed,
    unpublished rate until a bill confirms or refutes it. It is not in the classes' rates, so per-sandbox
    figures do not use it.
