- url: https://docs.e2b.dev/billing
  quote: Do I pay for stopped sandboxes? No. You only pay while a sandbox is actively running. Once a
    sandbox is paused, killed or times out, billing stops immediately.
- url: https://docs.e2b.dev/billing
  quote: Base price $0/month $150/month Custom Free credits $100 (one-time) No additional credits Custom
    Max vCPUs 8 8+ Custom Max memory 8 GiB 8+ GiB Custom Disk size 10 GiB 20+ GiB Custom Max continuous
    runtime 1 hour 24 hours Custom
- url: https://docs.e2b.dev/billing
  quote: Sandbox creation rate 1 / sec 5 / sec Custom Paused sandbox retention Unlimited Unlimited Unlimited
- url: https://docs.e2b.dev/billing
  quote: Upgrading to the Pro tier does not grant additional credits. It only increases the limits available
    to your project (such as concurrent sandboxes, continuous runtime, and resource ceilings).
- url: https://docs.e2b.dev/billing
  quote: You can customize allocated CPU and RAM when building custom templates by specifying cpuCount
    and memoryMB in the build configuration.
- url: https://docs.e2b.dev/billing
  quote: Need higher CPU or RAM limits? Contact support@e2b.dev for more information.
- url: https://docs.e2b.dev/billing
  quote: Allocate only what you need - Start with default resources (2 vCPU, 512 MiB RAM) and increase
    only if necessary
- url: https://docs.e2b.dev/billing
  quote: When am I charged? Automatically at the start of the month for the previous month’s usage. What
      happens when I run out of credits? If you have no payment method, every project in your workspace
      is blocked shortly afterwards. Add a payment method to continue using E2B. Can I set spending limits?
      Yes, you can set spending limits on the budget page in your dashboard.
- url: https://docs.e2b.dev/api-reference/templates/create-template-v3.md
  quote: 'CPUCount: type: integer format: int32 minimum: 1 description: CPU cores for the sandbox | MemoryMB:
    type: integer format: int32 minimum: 128 description: Memory for the sandbox |'
classes:
- name: default
  default: true
  rates:
    cpu:
      usd: '0.000014'
      per: vcpu-second
    memory:
      usd: '0.0000045'
      per: gib-second
  meter:
