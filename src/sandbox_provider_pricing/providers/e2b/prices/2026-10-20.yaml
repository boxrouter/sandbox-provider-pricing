exclusions:
- 'Plan fee: Hobby $0/month; Pro $150/month; Enterprise custom with a $3,000/month minimum. Usage is billed
  on top; upgrading to Pro grants no additional credits. The rates above are the same on Hobby and Pro.'
- 'Which plan each size needs: 1/2, 2/4, 4/8 and 2/8 fit Hobby (max 8 vCPU, 8 GiB; sessions up to 1 hour).
  8/16 exceeds Hobby''s 8 GiB and needs Pro or higher with a raised memory limit.'
- 'Concurrency add-ons on Pro: Pro+ 600 concurrent sandboxes +$500/mo; Pro++ 1,100 concurrent +$1,000/mo.'
- 'Storage: free, 10 GiB disk on Hobby and 20+ GiB on Pro; no separate storage rate is published.'
- 'Sandbox creation: no per-creation fee is published. Creation rate limit is 1 per second on Hobby and
  5 per second on Pro.'
- 'Network egress: no charge is published on the pricing page or the billing docs.'
- 'Paused sandboxes: not billed and retained indefinitely; no charge is published for retention.'
- Every size here needs a custom template (cpuCount, memoryMB); no template build or template storage
  charge is published.
- 'Plan allowance: Hobby: $0/month with a one-time $100 usage credit (about 603.9 sandbox-hours at 2 vCPU
  / 4 GiB), 20 concurrent sandboxes, 1-hour continuous runtime, up to 8 vCPU and 8 GiB, 10 GiB disk; when
  credits run out and there is no payment method, projects in the workspace are blocked until one is added.'
open_questions:
- 'Default size contradicts itself: the pricing page marks 2 vCPU / 4 GiB as [Default], while the billing
  docs still say default resources are 2 vCPU / 512 MiB RAM and a sandbox from E2B''s default template
  reported MemTotal about 478 MiB. That default would cost about $0.1089 per hour (2 x 0.0504 + 0.5 x
  0.0162). This entry prices custom templates at the sizes listed.'
- '8/16: whether E2B grants 16 GiB on Pro on request, and at the linear rate; no 16 GiB row is published.'
- The pages never say in words whether the meter is allocated or used CPU and RAM; both price tables are
  keyed by configured size, so allocation is assumed.
- 'Whether the $100 Hobby credit expires: it is described only as one-time.'
- Charges for egress, template builds and template storage are not published on the pages checked; absence
  is not confirmation that they are free.
- The concurrency add-on amounts come from the pricing page's calculator text (+$500/mo, +$1,000/mo);
  the billing docs do not list them.
