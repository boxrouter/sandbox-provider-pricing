exclusions:
- 'Plan fee: Hobby $0/month; Pro $150/month; Enterprise custom with a $3,000/month minimum. Usage is billed
  on top; upgrading to Pro grants no additional credits. The rates above are the same on Hobby and Pro.'
- 'Plan size limits: the billing page lists "Max vCPUs 8 8+ Custom" and "Max memory 8 GiB 8+ GiB Custom"
  for Hobby, Pro and Enterprise. The pricing page lists "Sessions up to 1 hour" and "Default sandbox CPU
  and RAM" for Hobby, and "Custom sandbox CPU and RAM" for Pro. For more, E2B says "Need higher
  CPU or RAM limits? Contact support@e2b.dev for more information."'
- 'Concurrency add-ons on Pro: Pro+ 600 concurrent sandboxes +$500/mo; Pro++ 1,100 concurrent +$1,000/mo.'
- 'Storage: the pricing page lists "Storage (GiB) Plan Costs 10 Hobby Free 20 Pro Free"; the billing page
  lists "Disk size 10 GiB 20+ GiB Custom". Neither page states a charge for disk above 20 GiB on Pro; no
  separate storage rate is published.'
- 'Sandbox creation: no per-creation fee is published. Creation rate limit is 1 per second on Hobby and
  5 per second on Pro.'
- 'Network egress: no charge is published on the pricing page or the billing docs.'
- 'Paused sandboxes: not billed and retained indefinitely; no charge is published for retention.'
- 'Templates: E2B says "You can customize allocated CPU and RAM when building custom templates by specifying
  cpuCount and memoryMB in the build configuration." No template build or template storage charge is
  published.'
- 'Plan allowance: Hobby: $0/month with a one-time $100 usage credit, 20 concurrent sandboxes, 1-hour
  continuous runtime, up to 8 vCPU and 8 GiB, 10 GiB disk; when credits run out and there is no payment
  method, projects in the workspace are blocked until one is added.'
open_questions:
- 'Default size contradicts itself: the pricing page marks 2 vCPU / 4 GiB as [Default], while the billing
  docs say default resources are 2 vCPU / 512 MiB RAM and the price FAQ says "A default sandbox has 2
  vCPU and 512 MiB (0.5 GiB) of RAM." That default would cost about $0.1089 per hour (2 x 0.0504 + 0.5
  x 0.0162).'
- 'Sizes above the price table: Pro lists "8+" vCPUs and "8+ GiB" of memory, but the price tables stop
  at 8 vCPUs and 8 GiB; whether larger sizes are charged at the same per-unit rates is not stated.'
- 'Whether the $100 Hobby credit expires: it is described only as one-time.'
- Charges for egress, template builds and template storage are not published on the pages checked; absence
  is not confirmation that they are free.
- The concurrency add-on amounts come from the pricing page's calculator text (+$500/mo, +$1,000/mo);
  the billing docs do not list them.
- 'Correction: this version supersedes e2b@2026-10-20 from the same effective date; no rate or class changed.
  It replaces the assumption that CPU and RAM are billed on allocation with E2B''s price FAQ, which says
  billing is based on the vCPU and RAM allocated to a sandbox. It restates plan size limits from E2B''s
  plan tables in place of text about sandbox sizes this version does not define, and removes a memory
  reading of the default template that no committed evidence records. It states disk only as the pricing
  and billing pages list it, instead of calling disk above 20 GiB on Pro free, and quotes the template
  API''s memory field in full.'
- 'Correction: this version supersedes e2b@2026-10-20-061802Z from the same effective date; no rate or class
  changed. Read 2026-10-29: e2b.dev/pricing now writes the plan prices as "Hobby FREE /$100 in credits (+usage
  costs)" and "pro $150 /month (+usage costs)", and a tooltip sits between "20 concurrent sandboxes" and
  "Default sandbox CPU and RAM" in the Hobby list. Only those three quotes changed; every rate quote is as before.'
