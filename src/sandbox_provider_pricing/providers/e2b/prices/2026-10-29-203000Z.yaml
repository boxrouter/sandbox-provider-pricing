- url: https://docs.e2b.dev/billing
  quote: When am I charged? Automatically at the start of the month for the previous month’s usage. What
      happens when I run out of credits? If you have no payment method, every project in your workspace
      is blocked shortly afterwards. Add a payment method to continue using E2B. Can I set spending limits?
      Yes, you can set spending limits on the budget page in your dashboard.
