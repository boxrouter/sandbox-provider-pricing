# yaml-language-server: $schema=../../../../../../schemas/billing.schema.json
name: Modal
website: https://modal.com
rules_version: 3

status:
  best_label: reported
  why_not_higher: Nothing. The figure counts only for an App proven to hold this one sandbox, with its report read at least 600 seconds after Modal's finished_at and its request window covering every billed hour.
  would_raise: Nothing. A shared App, an uncovered missing hour, another workspace or environment, or a read too early leaves the cost unknown.
revisit:
  after_s: 600
  until_s: 604800
  interval_s: 3600
  rationale: Across 325 sandboxes read every 5 minutes, final values appeared 59 to 315 seconds after the sandbox ended, so a first read at 600 seconds leaves a margin. Reading hourly and stopping after 7 days are defaults, because how long rows are kept and when they are final is unknown.
  unverified_default: true
reported_at_list_price:
  value: true
  source: src/sandbox_provider_pricing/providers/modal/evidence/2026-10-23-per-app-bill.md#results (in 325 Apps, each row's CPU and memory parts at the published us rates give the same billed duration within 0.05 seconds, and each row total equals its parts within $0.00000001. The bill is 2.22 seconds short of created_at to finished_at; that gap is in the time, not the rates.)

summary: >-
  Modal bills per App and hour, not per sandbox. When the caller proves an App held only the target sandbox, the sandbox's cost is the sum of its hourly USD rows; a missing row is zero only when the recorded request window covers that hour. The report is read at least 600 seconds after Modal's finished_at. In 325 one-sandbox Apps the rows stayed readable after the App stopped, and their totals were a little below the list price of created_at to finished_at. How long rows are kept is not verified.
formula: >-
  Modal's own bill for the App, when it held only this sandbox: the sum of hourly USD rows and covered empty hours, read at least 600 seconds after finished_at. Otherwise unknown.

rules:
  billed_on:
    answer: CPU (physical cores, 1 core = 2 vCPUs) and memory (GiB), each on the larger of requested and actual use. No sandbox cost is calculated from the request. Minimum request 0.125 cores and 128 MiB.
    sources: [https://modal.com/pricing, https://modal.com/docs/guide/sandbox-resources, https://modal.com/docs/guide/resources]
  starts:
    answer: Measured on 2026-10-11, not complete. Billing starts at about when Modal sets the sandbox's creation time, 20 to 70 ms before the create call returns. It does not start when the call is sent.
    sources: [src/sandbox_provider_pricing/providers/modal/evidence/2026-10-11-hourly-bill-batch.md#verdict]
  ends:
    answer: At Modal's finished_at, measured on 325 one-sandbox Apps; each App's bill stopped growing then, and its final rows appeared within 315 seconds. The exact edge and rounding are unsettled, as the median bill was 2.22 seconds below created_at to finished_at at list rates.
    sources: [src/sandbox_provider_pricing/providers/modal/evidence/2026-10-23-per-app-bill.md#verdict]
  rounding:
    answer: Billed per second, and Modal's billing page lists no minimum time increment. How a partial second is rounded is not stated.
    sources: [https://modal.com/pricing, https://modal.com/docs/guide/billing]
  idle_and_paused:
    answer: Not stated for sandboxes. The pricing page bills a 60-second default keep-alive for applications that take inputs, but does not say whether it applies to sandboxes. Sandboxes have a timeout (5 minutes by default, up to 24 hours) and an optional idle timeout, neither tied to billing. We have not measured this.
    sources: [https://modal.com/pricing, https://modal.com/docs/guide/sandbox-resources, https://modal.com/docs/guide/sandboxes]
  image_pull:
    answer: Modal's pages do not say. In our check, five cold images with pulls of 20 to 133 s were not billed (620 s billed against 611 s from create returned and 1,016 s from create sent).
    sources: [https://modal.com/pricing, src/sandbox_provider_pricing/providers/modal/evidence/2026-10-11-hourly-bill-batch.md#results]
  extra_charges:
    answer: Region multiplier on CPU, memory and GPU of 1.15 (broad region) or 1.75 (narrow region). Egress $0.04 per GiB above a workspace allowance, billed from 2026-10-01. Volumes $0.09 per GiB-month. GPUs per second by model. No snapshot or image storage price is stated.
    sources: [https://modal.com/docs/guide/region-selection, https://modal.com/docs/guide/network-egress-billing, https://modal.com/pricing, https://modal.com/docs/guide/sandbox-snapshots]
  left_out:
    answer: Plan fees (Starter $0, Team $250 per month), monthly free credits, credit programs, discounts, taxes, and the egress allowance. The list-price figure also leaves out volumes, snapshot retention and egress.
    sources: [https://modal.com/pricing, src/sandbox_provider_pricing/providers/modal/prices/2026-10-20-061900Z.yaml]
  per_sandbox_data:
    answer: Workspace.billing.report gives each App's hourly USD total and its cost per resource, with no sandbox ID. The recorded request window lets us identify covered hours with no returned row. Rows stayed readable after the App stopped, so stop each App to stay within the 200 deployed Apps a workspace allows. Retention past 2 h 5 min is untested.
    sources: [https://modal.com/docs/guide/billing, src/sandbox_provider_pricing/providers/modal/evidence/2026-10-23-per-app-bill.md#verdict, src/sandbox_provider_pricing/providers/modal/evidence/2026-10-23-per-app-bill.md#limits]

checks:
  - date: '2026-10-24'
    title: Per-sandbox cost through one Modal App per sandbox
    file: evidence/2026-10-23-per-app-bill.md
    result: Each of 325 Apps held one sandbox, and the rows of the six sandboxes that crossed an hour summed correctly. Final values appeared within 315 seconds of the sandbox's end and did not change before the last read. Longer retention was not tested.
  - date: '2026-10-11'
    title: Billing boundary against the hourly per-App bill
    file: evidence/2026-10-11-hourly-bill-batch.md
    result: 20 cached and 5 cold sandboxes. Image pulls were not billed and billing starts at about create returned. The end edge is unresolved, and the bill is 1.3% below (cached) and 1.5% above (cold) the shortest edge-based total.

open_questions:
  - question: Does actual CPU or memory use above its request add to a sandbox's bill?
    how: Run workloads that exceed their requests, each in its own App, and compare billed rows with the requested-size rate.
  - question: Why is the reported amount below the created_at-to-finished_at list-rate price by 2.22 seconds at the median?
    how: Repeat isolated CPU-only and memory-heavy cases in a region without a multiplier and compare provider times with the hourly bill.
  - question: How long are App billing rows retained, and can Modal revise them after the observed window?
    how: Re-read stopped-App rows beyond 2 hours 5 minutes after hour close and record any later changes or disappearance.
  - question: Does the 60-second keep-alive described for applications apply to sandboxes?
    how: Compare a sandbox's hourly App rows with its provider lifecycle span after it has been idle for over 60 seconds.
  - question: Do a GPU sandbox's CPU and memory bill at the Sandbox rate or the standard rate?
    how: Compare the hourly bill of a per-App GPU sandbox with its CPU and memory priced at each rate.

price_sheet:
  active_time_priced: {value: false, source_url: https://modal.com/docs/guide/billing}
  benchmark_region: {value: us, source_url: https://modal.com/docs/guide/region-selection}
  states:
    idle: {rule: running, note: billed as running, source_url: https://modal.com/docs/guide/sandbox-resources}
    paused: {rule: not_applicable, note: no paused state, source_url: https://modal.com/docs/guide/sandbox-resources}
  class_overrides:
    vm:
      rules:
        disk: {text: 'Fixed 512 GiB root disk, not billed separately.', source_url: https://modal.com/docs/guide/sandbox-resources}
  storage:
    - {kind: image, status: unpublished, source_url: https://modal.com/docs/guide/sandbox-resources}
    - {kind: disk, status: included, source_url: https://modal.com/docs/guide/sandbox-resources}
    - {kind: volume, status: pending, source_url: https://modal.com/pricing}
    - {kind: snapshot, status: unpublished, source_url: https://modal.com/docs/guide/sandbox-snapshots}
