exclusions:
- 'Network egress (new): from 2026-10-01 outbound traffic is $0.04 per GiB above a workspace-wide allowance
  of 1 TiB per billing cycle on Starter, 10 TiB on Team, 100 TiB on Enterprise. It counts all traffic
  sent through a container''s network interface, private network traffic sent directly to other Modal
  containers and uploads through Cloud Bucket Mounts; Volume reads and writes do not count. Tracked from
  2026-09-01 with no charge in September; the first bill with egress is 2026-11-01. A sandbox that sends
  almost no traffic stays inside the allowance.'
- 'Per-creation fee: none listed on the pricing page or the Sandbox docs'
- 'Volumes: $0.09 / GiB / month, first 1 TiB / month free (not included in the hourly rates here)'
- 'Sandbox snapshots: filesystem and directory snapshots expire 30 days after creation by default, and
  the TTL can be set per snapshot or expiry turned off; memory snapshots expire 7 days after creation and
  cannot currently be extended. No price stated (not included in the hourly rates here)'
- 'Plan fee: Starter $0 / month + compute; Team $250 / month + compute. The sandbox rates are the same
  on both.'
- 'Plan allowance: Starter: $0 / month plus compute, with $30 / month free credits, 100 containers and
  3 seats; Team $250 / month with $100 / month free credits and 5000 containers; credit programs for startups
  and academics up to $10k (by application)'
open_questions:
- No numeric maximum for cpu or memory is published.
- 'Image pull: Modal''s pages do not say whether an image pull is billed. In a check against Modal''s hourly
  per-App bill (providers/modal/evidence/2026-10-11-hourly-bill-batch.md), five cold public images whose
  pulls took 20 to 133 s inside the create call were not billed: 620 s billed against 611 s from create
  returned and 1,016 s from create sent.'
- 'Whether idle time or scheduling time before the container runs is billed: the docs say per second at
  max(request, actual) and document no idle discount. Confirm on the first monthly invoice'
- 'GPU basis: Modal does not state whether a GPU is billed on allocation or use; this version assumes
  allocation while running.'
- 'Disk: Modal bills a Function''s disk request (ephemeral_disk) by raising its memory request at 20:1,
  but a sandbox''s disk size cannot be increased, so a sandbox makes no disk request. Whether a sandbox''s
  disk adds to its memory charge is not stated; this version prices memory at its request.'
- Snapshot storage price is not published. The sandbox snapshots page, read 2026-10-20, states retention
  periods and no price, and the pricing page does not list snapshots.
- A third-party price list (ComputeSDK's pricing.json) shows memory at $0.00000672 / GiB-s against the
  official $0.00000667 used here; this third-party figure is unverified.
- 'Correction: this version supersedes modal@2026-10-20 from the same effective date; no rate changed.
  It removes the rule that priced disk as memory (20 GiB of disk per GiB) from the default class. Modal''s resources
  page ties the 20:1 rule to a Function''s ephemeral_disk request, and the sandbox resources page says a
  sandbox''s disk size cannot be increased. With the rule, a sandbox recorded with the VM runtime''s fixed
  512 GiB disk would be priced as 25.6 GiB of memory; now its memory is priced at the request and disk
  adds nothing. It also cites the region-selection page''s worked example, which multiplies CPU, memory and GPU, in
  place of an open question on memory; replaces the image pull question with the measured finding; states
  the full egress scope and snapshot retention as the live pages give them; and notes that the GPU basis
  is assumed.'
- 'Spec classes: this version adds `covers` to the default class, so a usage record whose class is the spec
  class `default` (gVisor) or `vm` is priced at the one Sandbox rate set. Read 2026-10-24: modal.com/pricing
  lists one Sandbox rate and no VM-specific rate.
  A usage class no price class covers is unknown. No rate changed.'
- 'Correction: this version supersedes modal@2026-10-24-065000Z from the same effective date; no rate changed.
  Read 2026-10-29: modal.com/pricing retitled the Sandbox section "Modal Sandbox pricing", labelled its CPU and
  memory rows "non-preemptible" and says Sandboxes are billed at non-preemptible rates of 3x list price. The
  CPU and memory figures are the ones used here, so only the first pricing-page quote changed.'
