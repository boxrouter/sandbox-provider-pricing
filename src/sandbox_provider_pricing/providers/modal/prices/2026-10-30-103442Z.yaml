sources:
- url: https://modal.com/pricing
  quote: Modal Sandbox pricing | Compute costs | CPU (non-preemptible) Physical core (2 vCPU equivalent)
    $0.00003942 / core / sec *minimum of 0.125 cores per container | Memory (non-preemptible) $0.00000667
    / GiB / sec
- url: https://modal.com/pricing
  quote: CPU $0.0000131 / core / sec Physical core (2 vCPU equivalent) *minimum of 0.125 cores per container
    Memory $0.00000222 / GiB / sec
- url: https://modal.com/pricing
  quote: 'How are CPU and memory usage metered? Modal continuously records CPU and memory consumption.
    CPU usage is tracked in terms of fractional physical cores, allowing for higher utilization compared
    to providers that set minimum thresholds for core charges. Note that each physical core is equivalent
    to 2 vCPUs as offered by AWS or GCP. You''ll be charged based on whichever is higher: the amount you
    request or the amount you actually use. Each container has a minimum request of 128 MiB of memory
    and 0.125 CPU cores, which you can increase if you need more resources.'
- url: https://modal.com/pricing
  quote: Starter $0 + compute / month | $30 / month free credits | 3 workspace seats included | 100 containers
    + 10 GPU concurrency | 1 TiB / month free network egress
- url: https://modal.com/pricing
  quote: Team $250 + compute / month | $100 / month free credits | Unlimited seats | 5000 containers +
    50 GPU concurrency | 10 TiB / month free network egress
- url: https://modal.com/pricing
  quote: Volumes $0.09 / GiB / mo *includes 1 TiB / mo free | Network Egress $0.04 / GiB *See plan for
    included usage / mo
- url: https://modal.com/pricing
  quote: Region selection | 1.15 - 1.75x base prices | 1.15 - 1.75x base prices | 1.15 - 1.75x base prices
- url: https://modal.com/docs/guide/sandbox-resources
  quote: The cpu parameter specifies physical CPU cores (1 core = 2 vCPUs), and memory specifies MiB
- url: https://modal.com/docs/guide/sandbox-resources
  quote: You’re charged max(request, actual) for both CPU and memory.
- url: https://modal.com/docs/guide/sandbox-resources
  quote: you only pay for the resources your Sandbox is actively using each second, with the small default request as the minimum.
- url: https://modal.com/docs/guide/sandbox-resources
  quote: Sandboxes have the same disk limits as other Modal containers, and their disk size cannot be
    increased. On the VM runtime , the root filesystem is a fixed 512 GiB.
- url: https://modal.com/docs/guide/resources
  quote: Note that this value corresponds to physical cores, not vCPUs.
- url: https://modal.com/docs/guide/resources
  quote: For both CPU and memory, a maximum is enforced at Function or Sandbox creation time to ensure
    your containers can be scheduled for execution. Requests exceeding the maximum will be rejected with
    an InvalidError .
- url: https://modal.com/docs/guide/resources
  quote: 'For CPU and memory, you’ll be charged based on whichever is higher: your request or actual usage.
    | Disk requests are billed by increasing the memory request at a 20:1 ratio.'
- url: https://modal.com/docs/guide/resources
  quote: Increased disk sizes can be requested with the ephemeral_disk parameter on @app.function().
- url: https://modal.com/docs/guide/region-selection
  quote: A multiplier on top of our base usage pricing will be applied to any Function or Sandbox that
    has a container region defined. | Broad (e.g. us ) | 1.15x | Narrow (e.g. us-west ) | 1.75x
- url: https://modal.com/docs/guide/region-selection
  quote: 'Here’s an example: let’s say you have a Function or Sandbox container that uses 1 T4, 1 CPU
    core, and 1GB memory. You’ve specified that it should run in us-west. The cost to run it for 1 hour
    would be ((T4 hourly cost) + (CPU hourly cost for one core) + (Memory hourly cost for one GB)) * 1.75.'
- url: https://modal.com/docs/guide/preemption
  quote: Modal Sandboxes are not subject to preemption, except in the case where a gpu requirement is
    specified.
- url: https://modal.com/docs/guide/network-egress-billing
  quote: Starting October 1, 2026, Modal charges for network egress. Network egress is outbound network
    traffic measured from your Modal tasks. This includes traffic sent through a container’s network interface,
    private network traffic sent directly to other Modal containers, and uploads through Cloud Bucket
    Mounts . Reads from and writes to Modal Volumes do not count as network egress.
- url: https://modal.com/docs/guide/network-egress-billing
  quote: Plan | Included per billing cycle | Additional egress | Starter | 1 TiB | $0.04 per GiB | Team
    | 10 TiB | $0.04 per GiB | Enterprise | 100 TiB | $0.04 per GiB
- url: https://modal.com/docs/guide/network-egress-billing
  quote: The allowance applies once to total egress across the entire Workspace. | Starting October 1,
    2026, egress is charged. Your first bill including egress arrives on November 1, 2026.
- url: https://modal.com/docs/guide/sandbox-snapshots
  quote: Filesystem Snapshot 30 days after creation Directory Snapshot 30 days after creation Memory Snapshot
    7 days after creation
- url: https://modal.com/docs/guide/sandbox-snapshots
  quote: Filesystem Snapshots and Directory Snapshots are Images and are automatically garbage collected
    after their TTL expires (30 days by default). You can configure a custom TTL when creating a snapshot,
    or opt out of expiry entirely to retain snapshots indefinitely. Memory Snapshots expire 7 days after
    creation and cannot currently be extended.
