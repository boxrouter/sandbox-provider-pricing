provider: superserve
version: superserve@2026-11-13-141358Z
effective_from: '2026-06-17T00:00:00Z'
retrieved_at: '2026-11-13T14:13:58Z'
supersedes:
- superserve@2026-11-13
sources:
- url: https://api.superserve.ai/billing/pricing/public
