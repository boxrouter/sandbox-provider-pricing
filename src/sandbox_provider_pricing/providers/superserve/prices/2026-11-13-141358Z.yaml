classes:
- name: default
  default: true
  rates:
    cpu:
      usd: '0.000014'
      per: vcpu-second
    memory:
      usd: '0.0000045'
      per: gib-second
  meter:
    cpu:
      basis: allocated
      billed_states:
      - running
    memory:
      basis: allocated
      billed_states:
      - running
exclusions:
- 'Storage: the pricing page lists $0.000108 per GiB-hour for a shared template once
  plus each sandbox''s retained changes, not its allocated disk, and says it is billed
  for as long as it is kept. The public pricing JSON lists the same rate with "billable":false.
  The two sources conflict, so no storage rate is priced here. In the sandboxes measured, storage was charged 0
  (see the disk coverage entry).'
- 'Plan fees: Developer $20 per month including $20 of usage; Pro $250 per month including
  $250 of usage; Enterprise custom. The usage rates are the same on every plan.'
- 'Network: the pricing page says its estimates "exclude taxes, network, and external
  model API charges"; no network charge is published.'
coverage:
  cpu:
    treatment: in_quote
    source: https://api.superserve.ai/billing/pricing/public
    note: Billed per vCPU-second while the sandbox is running; compute is not billed
      while paused.
  memory:
    treatment: in_quote
    source: https://api.superserve.ai/billing/pricing/public
    note: Billed per GiB-second of the memory the sandbox holds while it is running;
      paused sandboxes are not billed for it.
  disk:
    treatment: not_billed
    source: https://api.superserve.ai/billing/pricing/public
    note: 'Not billed for sandboxes as BoxRouter runs them, which are never kept paused. The
      public pricing JSON marks storage "billable":false, and a measured sandbox paused 11 min
      18 s with 1 GiB written was charged 0 for storage; compute and memory ended at the pause.
      The pricing page says storage "is billed for as long as you keep it"; that conflict is
      open for a sandbox kept paused for hours, which BoxRouter does not do: its adapter offers
      no pause, and it creates with auto_delete_seconds 0, so a timeout pause deletes the sandbox
      about 0.24 s later. Not a general claim that storage is free.'
  creation:
    treatment: unbounded
    source: https://www.superserve.ai/pricing/
    note: No per-creation fee is published. Not published on the pages checked; treated
      as possibly billable, never as free.
  egress:
    treatment: unbounded
    source: https://www.superserve.ai/pricing/
    note: No network charge is published; the pricing page says its estimates exclude
      network. Treated as possibly billable, never as free.
  snapshot_storage:
    treatment: unbounded
    source: https://www.superserve.ai/pricing/
    note: Paused sandbox data is retained and the pricing page says storage is billed
      for as long as it is kept, but the public pricing JSON says storage is not billable.
      Treated as possibly billable, never as free.
  image_storage:
    treatment: unbounded
    source: https://www.superserve.ai/pricing/
    note: The shared template is counted once in storage, which the two sources disagree
      on billing. Treated as possibly billable, never as free.
  volume_storage:
    treatment: unbounded
    source: https://www.superserve.ai/pricing/
    note: No volume product or charge is published. Not published on the pages checked;
      treated as possibly billable, never as free.
  requests:
    treatment: unbounded
    source: https://www.superserve.ai/pricing/
    note: No per-request charge is published. Not published on the pages checked;
      treated as possibly billable, never as free.
open_questions:
- 'Whether storage is billed: the pricing page lists $0.000108 per GiB-hour "billed
  while stored", and the public pricing JSON marks storage_gib "billable":false. Which
  rate applies to a sandbox kept paused for hours, and from when, is not stated.'
- Whether a sandbox's storage can be read per sandbox; the team-level usage endpoint
  reports vCPU, memory and storage seconds, but no per-sandbox usage record is documented.
- Rounding, minimum charge and billing of the starting, pausing and resuming states
  are not stated; only active and paused are described.
- 'Correction: this version supersedes superserve@2026-11-13 from the same effective date; no
  rate, class or source quote changed, and the pricing JSON read again at its retrieved_at
  matches. It states disk as not billed in `coverage`, where the earlier version stated it as
  unbounded, so a reservation quote for a managed sandbox is bounded. This holds for BoxRouter''s
  use, where no Superserve sandbox is kept paused: the pricing JSON marks storage not billable,
  and measured sandboxes were charged 0 for storage, one of them paused 11 min 18 s
  (providers/superserve/evidence/2026-11-13-paused-storage.md). The pricing page''s statement that
  storage is billed for as long as it is kept is not settled for a long retained pause; the
  daily price watch opens an issue if the pricing JSON turns storage billable.'
