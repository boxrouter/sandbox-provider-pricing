exclusions:
- 'Disk: 64 GB ephemeral NVMe per sandbox is included; no separate disk charge (SDK 3.0.0+ or custom image;
  32 GB for deprecated runtimes).'
- 'Network: data the sandbox sends to the internet and all traffic on exposed ports is billable, downloads
  are free. Priced at the iad1 list rate, $0.15/GB. Plan allowances are not deducted: Hobby includes 20
  GB/month, and the plan table lists Pro data transfer as included in Flat Rate CDN, whose lowest tier,
  included with Pro, has a capacity of 1 TB of data transfer each month. A sandbox that sends almost no
  data pays almost nothing here.'
- 'Drives (not included in the hourly rates here): $0.05/GB-month storage, $0.0015/GB reads, $0.004/GB
  writes at iad1.'
- 'Plan fee: Pro $20/month platform fee (1 deploying seat and $20/month usage credit, which expires monthly),
  extra seats $20/month each. Hobby $0. Pro and Enterprise list the same rates except data transfer, and
  Enterprise plans have custom pricing; Hobby usage is never billed. The list-price basis is Pro, with data
  transfer at the iad1 rate; 1/2, 2/4 and 4/8 also run on Hobby (free within quota, then creation is paused); 8/16
  needs Pro.'
- 'Plan allowance: Hobby, per month: 5 active CPU-hours, 420 GB-hours, 5,000 creations, 20 GB data transfer,
  15 GB snapshot storage (lifetime); 10 concurrent sandboxes, 45-minute sessions, at most 4 vCPU / 8 GB;
  past the quota creation is paused, never billed. At 2 vCPU / 4 GiB that is 105 sandbox-hours of memory
  or 2.5 h of full CPU (25 h at 10% active). Pro: the $20/month credit applies to sandbox usage.'
open_questions:
- GB vs GiB is not defined by Vercel. The billed quantity is not in doubt (4 GB for a 2 vCPU sandbox,
  matching all four of the page's worked examples), so total_usd holds either way; only the per-GiB normalization
  rests on 1 GB = 1 GiB = 1024 MB, inferred from the REST 2048 MB per 2 GB and MemTotal 4283 MiB.
- 'Regional rates: the page''s per-region table is an interactive selector and the fetched text shows
  only the default (iad1) rows. The base rates the page says apply to iad1 are used here. vercel.com/pricing
  says Sandbox rates are ''Starting at'' these, so other regions may cost more.'
- '''Active CPU'' is per vCPU only by the page''s worked examples (the metric text does not say); its
  sampling granularity and any minimum are not stated. The REST response reports totalActiveCpuDurationMs,
  which can measure it once a charge is compared.'
- Only memory has a documented 1 minute minimum; whether CPU has one is not stated.
- The Pro plan is the list-price basis. On the Hobby plan usage is free within quota.
- 'Correction: this version supersedes vercel@2026-10-12 and vercel@2026-10-20 from vercel@2026-10-12''s
  effective date (no rate changed between them), and prices data
  transfer at $0.15/GB instead of $0. The earlier version read the plan table''s "Included in Flat Rate
  CDN" for Pro as free. The regional rate table lists $0.15 per GB for iad1 with no plan qualifier, Flat
  Rate CDN on Pro is a tier with a fixed monthly capacity, and a billing charges export priced one data
  transfer row at $0.15 per GB. All other rates are unchanged.'
- An earlier price version used 4.295 GB for memory (0.0911); the current page bills 4 GB (0.0848).
- 'Range: the lower bound is memory only and the upper bound is memory plus all vCPUs fully active; the
  numeric bounds depend on sandbox size.'
